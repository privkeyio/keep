name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Include ready_for_review so a draft->ready transition re-runs CI. The
    # build/lint jobs are gated on `draft != true`; without this trigger their
    # required checks stay skipped after undrafting and block the PR forever.
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: no job in this workflow writes to the repo, but every job runs
# third-party actions (cargo-deny, setup-android, taiki-e/install-action, rust-cache).
# Pin GITHUB_TOKEN to read-only so a compromised action cannot use whatever scope the
# repository's ambient default grants (which can be write on push / same-repo PRs).
permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true && github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: |
          # GitHub-hosted runners preload third-party apt repos (Microsoft, Google)
          # whose mirrors intermittently serve invalid InRelease files, which fails
          # `apt-get update`. None of them provide the packages below, so drop them.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*google*
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev libgtk-3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt -- --check
      # --all-targets so test code is linted too, and the features named
      # explicitly rather than arriving through workspace feature unification,
      # which silently decided whether the ed25519 module was linted at all.
      - run: cargo clippy --workspace --all-targets --features keep-frost-net/testing,keep-core/ed25519 -- -D warnings
      # The reproducible and Debian builds run only on pushes and tags, so a
      # workspace member missing from their Dockerfiles is caught here instead.
      - run: scripts/check-dockerfile-members.sh
      # keep-agent-py and keep-agent-ts are excluded from the workspace (cdylib
      # bindings with their own lockfiles), so --workspace never sees them. Check
      # them explicitly to catch dependency drift that only surfaces on compile.
      - run: cargo fmt --manifest-path keep-agent-py/Cargo.toml -- --check
      - run: cargo clippy --manifest-path keep-agent-py/Cargo.toml -- -D warnings
      - run: cargo fmt --manifest-path keep-agent-ts/Cargo.toml -- --check
      - run: cargo clippy --manifest-path keep-agent-ts/Cargo.toml -- -D warnings

  build:
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.draft != true && github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on pull requests too, not only on push. It is the one
        # platform job that has caught a real failure, and it caught it after
        # merge: a timing-sensitive test that passes on a fast runner and fails
        # on a slow one turned main red from a pull request that was fully
        # green. Finding that before merge costs runner minutes; finding it
        # after costs a red main plus the work to bisect it.
        #
        # The packaging jobs below stay push-only deliberately. They verify how
        # artifacts are assembled rather than how the code behaves, so they are
        # far less likely to catch a logic change, and they are the expensive
        # ones to run per pull request.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # GitHub-hosted runners preload third-party apt repos (Microsoft, Google)
          # whose mirrors intermittently serve invalid InRelease files, which fails
          # `apt-get update`. None of them provide the packages below, so drop them.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*google*
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev libgtk-3-dev libxdo-dev
      - name: Install Xcode tools (macOS)
        if: matrix.os == 'macos-latest'
        run: xcode-select --install || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}
      - run: cargo build --release
      - run: cargo test --workspace --lib --bins
      # The ed25519 module is behind a feature nothing else here enables, so its
      # tests were type-checked by clippy and never run. That is the ciphersuite
      # whose 64-byte scalar fill the draw criteria are written around.
      - run: cargo test -p keep-core --features ed25519 --lib
      - run: cargo test -p keep-core --features testing --test integration_tests
      - run: cargo test -p keep-frost-net --features testing --test multinode_test
      - run: cargo test -p keep-frost-net --features testing --test taproot_key_spend_memory_test
      # DKG over a real relay websocket, which forwards the ephemeral DKG events
      # only to subscribers already listening and never stores them.
      - run: cargo test -p keep-frost-net --test dkg_relay_e2e_test
      - run: cargo test -p keep-enclave-host --test integration_tests
      # keep-nip46's suites live in tests/, which `--workspace --lib --bins`
      # above does not build, so without this step the bunker and NIP-46 client
      # integration tests never run in CI. `#[ignore]`d live-relay tests stay
      # excluded.
      - run: cargo test -p keep-nip46
      # keep-enclave-bin (the Nitro Enclave binary) is a separate workspace excluded
      # from the root workspace, so `cargo test --workspace` never builds it. It is
      # target_os=linux gated (vsock), so build and test it explicitly on Linux only,
      # otherwise a compile break or test regression in the enclave signer/policy code
      # would not be caught by CI.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --manifest-path keep-enclave/enclave/Cargo.toml
      # The MCP agent surface is behind the non-default `mcp` feature, so the
      # workspace test run above never compiles it; run its tests explicitly.
      - run: cargo test -p keep-agent --features mcp --lib
      # keep-approval's vectors are an integration test, which the
      # `--lib --bins` run above never builds.
      - run: cargo test -p keep-approval
      # The stand-in phones the approvals end to end tests drive: keep-agent's,
      # and keep-mobile's approver, the app's own code.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo build --release -p keep-agent --features mcp --example approval_peer
      - if: matrix.os == 'ubuntu-latest'
        run: cargo build --release -p keep-mobile --example mobile_approver
      # Adversarial PSBTs and a seeded mutation loop against the single-key signer.
      - run: cargo test -p keep-bitcoin --release --test psbt_stress
      # End-to-end CLI tests drive the release `keep` binary built above as a
      # subprocess (the tests locate `target/release/keep`), so run them in
      # --release too. Previously only compile-checked, never executed in CI.
      - run: cargo test -p keep-cli --release --test cli_integration
      # The agent gateway end to end in strong mode, with real users for the
      # gateway, its admin, two agents and an outsider. Creating them needs
      # root, so it runs under sudo, on Linux, where the gateway runs.
      # The inject worker the gateway e2e sends http_request through to its
      # own test server: the same keep with one throwaway test root added,
      # built with a --cfg no feature can turn on, into its own target
      # directory. The release keep must not carry the root's marker.
      - if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 30
        run: |
          scripts/lib/inject-e2e-pki.sh "$RUNNER_TEMP/inject-pki"
          KEEP_E2E_CA_DER="$RUNNER_TEMP/inject-pki/ca.der" RUSTFLAGS='--cfg keep_e2e_roots' \
            cargo build --release -p keep-cli --target-dir target/e2e-roots
          grep -q keep-e2e-roots-build target/e2e-roots/release/keep
          if grep -q keep-e2e-roots-build target/release/keep; then
            echo "the release keep carries the e2e test root" >&2
            exit 1
          fi
      # The SSH checks log in to sshd on loopback.
      - if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q openssh-server
          fi
          sudo KEEP_GATEWAY_E2E=1 scripts/gateway-e2e.sh target/release/keep target/e2e-roots/release/keep "$RUNNER_TEMP/inject-pki"
      # The shipped systemd unit, booted for real on the runner: it passes
      # systemd-analyze verify, unlocks the gateway from an encrypted
      # credential, serves an MCP client through the bridge, restarts
      # unattended and refuses to start when misconfigured.
      - if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: sudo KEEP_GATEWAY_SYSTEMD_E2E=1 scripts/gateway-systemd-e2e.sh target/release/keep target/release/examples/approval_peer target/e2e-roots/release/keep "$RUNNER_TEMP/inject-pki"
      # Approvals end to end over a local relay: the relay helper, pairing
      # the stand-in phone, approved and refused requests, freezes and
      # management changes, as real users.
      - if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: sudo KEEP_GATEWAY_E2E=1 scripts/gateway-approvals-e2e.sh target/release/keep target/release/examples/approval_peer
      # The same with keep-mobile's approver as the phone, signing as the
      # Android Keystore does.
      - if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: sudo KEEP_GATEWAY_E2E=1 KEEP_E2E_PHONE=target/release/examples/mobile_approver scripts/gateway-approvals-e2e.sh target/release/keep target/release/examples/approval_peer
      # A network key-path spend between two `keep` processes over an in-process
      # relay. The binary is rebuilt with `local-relay-tests` so it accepts a
      # loopback ws:// relay; this stays the last step so no later step runs it.
      - run: cargo test -p keep-cli --release --features local-relay-tests --test frost_spend_network

  build-windows:
    runs-on: windows-latest
    # Tests only: the release workflow builds the Windows binaries, and a release
    # build here took most of this job's time.
    if: github.event.pull_request.draft != true && github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-latest
      - run: cargo test --workspace --lib --bins

  android:
    # keep-mobile is a workspace member, so the jobs above compile it for the host
    # target only. Its `cfg(target_os = "android")` logging branch and the
    # android-only tracing-android dependency are built by nothing here, and no
    # other job runs uniffi-bindgen. Both would otherwise break first in the
    # Android app repository, which pins this repo at a commit and so lags main.
    #
    # NDK, cargo-ndk, and Rust versions must stay in sync with that repository's
    # build-rust.sh, which builds the shipped library from these same sources.
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true && github.event_name != 'schedule'
    env:
      NDK_VERSION: "29.0.14206865"
      CARGO_NDK_VERSION: "4.1.2"
      ANDROID_TARGET: aarch64-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: |
          # GitHub-hosted runners preload third-party apt repos (Microsoft, Google)
          # whose mirrors intermittently serve invalid InRelease files, which fails
          # `apt-get update`. None of them provide the packages below, so drop them.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*google*
          sudo apt-get update
          # aws-lc-sys (via rustls) compiles bundled C through the NDK's cmake
          # toolchain, which only reliably supports the Ninja generator.
          sudo apt-get install -y ninja-build
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
      - name: Install Android NDK
        run: sdkmanager --install "ndk;$NDK_VERSION"
      # rust-toolchain.toml pins the channel, so the Android target has to be added
      # to that exact toolchain rather than to whatever `stable` resolves to.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}
      - name: Cross-compile keep-mobile for Android
        working-directory: keep-mobile
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo "pinned NDK $NDK_VERSION not found at $NDK_DIR" >&2
            exit 1
          fi
          # Runners preinstall a different NDK and set ANDROID_NDK_ROOT, which
          # cargo-ndk would silently prefer. Force every var it consults.
          export ANDROID_NDK_HOME="$NDK_DIR" ANDROID_NDK_ROOT="$NDK_DIR" ANDROID_NDK="$NDK_DIR"
          export CMAKE_GENERATOR=Ninja AWS_LC_SYS_CMAKE_BUILDER=1
          cargo ndk -t "$ANDROID_TARGET" -P 33 -o "$RUNNER_TEMP/jniLibs" build --release --locked
      - name: Generate Kotlin bindings
        working-directory: keep-mobile
        run: |
          cargo run --locked --features cli --bin uniffi-bindgen generate \
            --library "$RUNNER_TEMP/jniLibs/arm64-v8a/libkeep_mobile.so" \
            --language kotlin --no-format --out-dir "$RUNNER_TEMP/kotlin"
          test -f "$RUNNER_TEMP/kotlin/io/privkey/keep/uniffi/keep_mobile.kt"
      # Generating is not compiling: an exported name can collide with one the
      # Kotlin generator adds itself, such as the AutoCloseable `close()` on every
      # object, and only kotlinc reports that.
      - name: Compile Kotlin bindings
        env:
          KOTLIN_VERSION: "2.4.21"
          KOTLIN_SHA256: 7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd
          JNA_VERSION: "5.18.1"
          JNA_SHA256: 260c4b1e22b1db9e110ee441c4f13ce115f841fa48c41d78750986214b395557
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o kotlinc.zip "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          curl -fsSL -o jna.jar "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA_VERSION/jna-$JNA_VERSION.jar"
          printf '%s  kotlinc.zip\n%s  jna.jar\n' "$KOTLIN_SHA256" "$JNA_SHA256" | sha256sum -c -
          unzip -q kotlinc.zip
          ./kotlinc/bin/kotlinc kotlin/io/privkey/keep/uniffi/keep_mobile.kt -cp jna.jar -d kotlin-classes

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: |
          # GitHub-hosted runners preload third-party apt repos (Microsoft, Google)
          # whose mirrors intermittently serve invalid InRelease files, which fails
          # `apt-get update`. None of them provide the packages below, so drop them.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*google*
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev libgtk-3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
      - run: cargo check --all-targets --features testing

  # Whether a pull request touches what the release images are built from:
  # the reproducible and Debian builds below run on those, and on every push.
  release-inputs:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE"...HEAD)
          if grep -qE '(^|/)Cargo\.(toml|lock)$|^Dockerfile|^\.dockerignore$|^LICENSE$|^contrib/|^keep-web/ui/|^rust-toolchain|^\.github/workflows/ci\.yml$' <<<"$files"; then
            echo changed=true >>"$GITHUB_OUTPUT"
          else
            echo changed=false >>"$GITHUB_OUTPUT"
          fi

  reproducible:
    runs-on: ubuntu-latest
    needs: release-inputs
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.release-inputs.outputs.changed == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        run: docker build -f Dockerfile.reproducible -o type=local,dest=./dist1 .
      # Twice only on pushes: once is enough to show a pull request builds.
      - name: Build again and compare
        if: github.event_name == 'push'
        run: |
          docker build --no-cache -f Dockerfile.reproducible -o type=local,dest=./dist2 .
          for bin in keep keep-desktop keep-web; do
            HASH1=$(sha256sum "dist1/$bin" | cut -d' ' -f1)
            HASH2=$(sha256sum "dist2/$bin" | cut -d' ' -f1)
            echo "$bin build 1: $HASH1"
            echo "$bin build 2: $HASH2"
            if [ "$HASH1" != "$HASH2" ]; then
              echo "Reproducibility check failed for $bin"
              exit 1
            fi
          done
          echo "Reproducible build verified"

  debian:
    runs-on: ubuntu-latest
    needs: release-inputs
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.release-inputs.outputs.changed == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Debian packages
        run: docker build -f contrib/debian/Dockerfile -o type=local,dest=./dist .
      - name: Check package metadata
        run: |
          v=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          test -f "dist/keep_${v}_amd64.deb"
          test -f "dist/keep-web_${v}_amd64.deb"
          # Assert the exact published floor, not merely that one exists: the
          # packages are built on bookworm so they install on Debian 12 and
          # Ubuntu 22.04, and a newer build host silently raises this.
          for pkg in keep keep-web; do
            dpkg-deb -f "dist/${pkg}_${v}_amd64.deb" Depends \
              | grep -Eq '(^|, )libc6 \(>= 2\.34\)(,|$)'
          done
          dpkg-deb -f "dist/keep_${v}_amd64.deb" Depends | grep -q 'libudev1'
          # Conffiles must stay out of md5sums, or dpkg -V reports the config
          # as modified on every host where the admin edited it.
          dpkg-deb --ctrl-tarfile "dist/keep-web_${v}_amd64.deb" \
            | tar -xO ./md5sums > md5sums.txt
          if grep -q 'etc/keep-web' md5sums.txt; then
            echo "conffile listed in md5sums" >&2
            exit 1
          fi
      - name: Lintian
        run: |
          docker run --rm -v "$PWD/dist:/debs:ro" debian:bookworm-slim sh -c \
            'apt-get update -qq && apt-get install -y -qq lintian >/dev/null \
             && lintian --fail-on warning,error /debs/*.deb'

  fuzz:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: |
          # GitHub-hosted runners preload third-party apt repos (Microsoft, Google)
          # whose mirrors intermittently serve invalid InRelease files, which fails
          # `apt-get update`. None of them provide the packages below, so drop them.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* /etc/apt/sources.list.d/*google*
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libudev-dev libgtk-3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz nsec parsing
        run: cargo +nightly fuzz run fuzz_nsec -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz npub parsing
        run: cargo +nightly fuzz run fuzz_npub -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz vault header parsing
        run: cargo +nightly fuzz run fuzz_vault_header -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz FROST messages
        run: cargo +nightly fuzz run fuzz_frost_messages -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz TPM quote parsing
        run: cargo +nightly fuzz run fuzz_tpm_quote -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz encrypted data
        run: cargo +nightly fuzz run fuzz_encrypted_data -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz share export
        run: cargo +nightly fuzz run fuzz_share_export -- -max_total_time=30
        working-directory: fuzz
