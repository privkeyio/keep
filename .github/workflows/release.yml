name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build reproducible binary
        run: docker build -f Dockerfile.reproducible -o type=local,dest=./dist .
      - name: Rename binaries
        run: |
          mv dist/keep keep-linux-x86_64
          mv dist/keep-desktop keep-desktop-linux-x86_64
          mv dist/keep-web keep-web-linux-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux
          path: |
            keep-linux-x86_64
            keep-desktop-linux-x86_64
            keep-web-linux-x86_64

  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The package version comes from Cargo.toml while the release comes from
      # the tag. Without this, tagging without bumping publishes packages
      # carrying the previous version number alongside the new binaries.
      - name: Verify the workspace version matches the tag
        run: |
          v=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "$v" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Cargo.toml version $v does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Build Debian packages
        run: |
          docker build -f contrib/debian/Dockerfile \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            -o type=local,dest=./dist .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debian
          path: dist/*.deb
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: xcode-select --install || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --release --locked
      - run: |
          mv target/release/keep keep-macos-x86_64
          mv target/release/keep-desktop keep-desktop-macos-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos
          path: |
            keep-macos-x86_64
            keep-desktop-macos-x86_64

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: xcode-select --install || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos-arm
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: |
          mv target/aarch64-apple-darwin/release/keep keep-macos-aarch64
          mv target/aarch64-apple-darwin/release/keep-desktop keep-desktop-macos-aarch64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm
          path: |
            keep-macos-aarch64
            keep-desktop-macos-aarch64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --release --locked
      - run: |
          mv target/release/keep.exe keep-windows-x86_64.exe
          mv target/release/keep-desktop.exe keep-desktop-windows-x86_64.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows
          path: |
            keep-windows-x86_64.exe
            keep-desktop-windows-x86_64.exe

  release:
    needs: [build-linux, build-deb, build-macos, build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      # Ship the release-signing public key so users can verify the
      # maintainer-signed SHA256SUMS.minisig once it is uploaded. Signing itself
      # stays offline; see docs/RELEASE_SIGNING.md.
      - name: Attach signing public key
        run: |
          if [ -f release-signing.pub ]; then
            cp release-signing.pub artifacts/
          else
            echo "release-signing.pub not present; skipping (run the group ceremony to add it)"
          fi
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: artifacts/*
          generate_release_notes: true
