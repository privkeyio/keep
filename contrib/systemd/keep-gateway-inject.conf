# Secrets for the Keep agent gateway: serve http_request through inject
# workers. Install as /etc/systemd/system/keep-gateway.service.d/inject.conf
# with keep-gateway-inject.socket and keep-gateway-inject@.service (see
# docs/USAGE.md, "Secrets"), and add --inject-socket to the gateway's
# ExecStart= in the same drop-in that sets its other options.

[Unit]
Wants=keep-gateway-inject.socket
After=keep-gateway-inject.socket
