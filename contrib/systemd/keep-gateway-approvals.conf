# Approvals for the Keep agent gateway. Install as
# /etc/systemd/system/keep-gateway.service.d/approvals.conf, beside the
# keep-gateway-relay.service helper (see docs/USAGE.md, "Approvals").
#
# Before the first start:
#   - the `keep-gateway-relay` user and group;
#   - the channel key sealed to this machine, never stored in the vault:
#       sudo -v
#       keep gateway channel-key new | sudo systemd-creds encrypt \
#         --name=channel-key --with-key=host+tpm2 --tpm2-pcrs=7 - \
#         /etc/keep/gateway/channel-key.cred
#   - at least one --approval-relay in the gateway's ExecStart=.

[Service]
# systemd decrypts the channel key into the same directory as the vault
# password; the gateway reads it from there and from nowhere else.
LoadCredentialEncrypted=channel-key:/etc/keep/gateway/channel-key.cred

# The relay socket's directory: only the relay helper's user may reach the
# socket, through its group. Made as root before each start, as the other
# socket directories are.
ExecStartPre=+/usr/bin/install -d -m 0750 -o keep-gateway -g keep-gateway-relay /run/keep-gateway-relay
ReadWritePaths=-/run/keep-gateway-relay
