[package]
name = "keep-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "keep-desktop"
path = "src/main.rs"

[dependencies]
keep-core = { path = "../keep-core" }
keep-bitcoin = { path = "../keep-bitcoin", features = ["esplora-chain-view"] }
keep-frost-net = { path = "../keep-frost-net" }
keep-nip46 = { path = "../keep-nip46" }
bitcoin = { workspace = true }
iced = { version = "0.14.0", features = ["tokio", "qr_code", "lazy", "tiny-skia", "image"] }
tray-icon = "0.24"
notify-rust = "4"
nostr-sdk = { workspace = true }
hex = { workspace = true }
base64 = "0.23"
dirs = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rustls = { version = "0.23", features = ["ring"] }
tempfile = "3"
nokhwa = { version = "0.10", features = ["input-native"] }
rxing = "0.9"
image = "0.25"
rfd = "0.17"
keep-mobile = { path = "../keep-mobile", optional = true }
keep-approval = { path = "../keep-approval", optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8"], optional = true }

[features]
# A stand-in phone for gateway end-to-end tests: trusts only a test
# attestation root and allows loopback ws:// relays. Never for real use.
test-approver = [
    "dep:keep-mobile",
    "dep:keep-approval",
    "keep-approval/test-attestation",
    "dep:p256",
    "keep-core/allow-ws",
    "keep-core/allow-internal",
]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
