[package]
name = "keep-mobile"
version.workspace = true
edition = "2021"
rust-version = "1.89"
description = "UniFFI bindings for Keep mobile platforms"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
keep-core = { path = "../keep-core" }
keep-bitcoin = { path = "../keep-bitcoin" }
keep-frost-net = { path = "../keep-frost-net", default-features = false }
keep-nip46 = { path = "../keep-nip46" }
keep-approval = { path = "../keep-approval" }
bitcoin = { version = "0.32", features = ["serde", "base64"] }
frost-secp256k1-tr = { version = "3.0", default-features = false }
uniffi = { version = "0.32" }
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = "0.4"
k256 = { version = "0.13.4", features = ["schnorr"] }
base64 = "0.23"
url = "2.5"
zeroize = { workspace = true }
subtle = { workspace = true }
flate2 = "1.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing = "0.1"
nostr-sdk = { version = "0.44", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[dev-dependencies]
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8"] }
nostr-relay-builder = "0.44"
# The test relays listen on loopback, which the pinned transport otherwise
# screens out.
keep-core = { path = "../keep-core", features = ["allow-internal"] }

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[features]
# The uniffi CLI (uniffi_bindgen + its askama templates) is only needed by the
# uniffi-bindgen binary below, not by the runtime cdylib. Keeping it out of the
# library build stops the non-deterministic bindgen/askama codegen from being
# linked into libkeep_mobile.so, which is required for reproducible F-Droid
# builds. Enable it only when building the binary (see required-features).
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]
